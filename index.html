<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUN - Multi-Sphere Logic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Inter:wght@300;400;500&display=swap"
        rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <input type="text" id="hidden-input" autofocus>

    <div id="loader-overlay" class="loader-overlay">
        <div class="geo-shape"></div>
        <div id="loader-text" class="loader-text">INITIALIZING</div>
    </div>

    <div id="user-display" class="user-typing"></div>
    <div id="vox-display" class="vox-transcription"></div>
    <div id="vox-prompt" class="vox-prompt">Baixar transcrição? (Digite "sim" ou "não")</div>

    <div id="status" class="status-text">
        <span class="green-text">Node</span> conectado
    </div>
    <div class="beta-warning">O modelo Sory está em testes betas e pode apresentar instabilidades</div>
    <canvas id="background-aura"></canvas>
    <canvas id="canvas"></canvas>

    <!-- Settings Button -->
    <div id="settings-btn" onclick="openSettings()" style="position: absolute; top: 20px; right: 20px; z-index: 1000; cursor: pointer; opacity: 0.5; transition: opacity 0.3s;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="settings-modal hidden">
        <div class="settings-content glass-card">
            <h2 style="margin-top: 0; font-size: 1.2rem; letter-spacing: 2px; color: var(--accent); margin-bottom: 20px;">CONFIGURAÇÃO DO SISTEMA</h2>

            <div class="setting-group">
                <label>CHAVE GEMINI API</label>
                <input type="password" id="cfg-gemini-key" placeholder="AIza...">
            </div>

            <div class="setting-group">
                <label>CHAVE GOOGLE CLOUD (TTS)</label>
                <input type="password" id="cfg-google-key" placeholder="AIza...">
            </div>

            <div class="setting-group">
                <label>PROVEDOR DE VOZ</label>
                <select id="cfg-tts-provider">
                    <option value="native">Nativo (Browser)</option>
                    <option value="google">Google Cloud (Neural)</option>
                </select>
            </div>

            <div class="setting-group">
                <label>VOZ GOOGLE ID</label>
                <input type="text" id="cfg-voice-id" placeholder="pt-BR-Neural2-A" value="pt-BR-Neural2-A">
            </div>

            <div class="settings-actions">
                <button onclick="saveConfig()">SALVAR</button>
                <button onclick="closeSettings()" class="secondary">FECHAR</button>
            </div>
        </div>
    </div>

    <!-- Modularized Scripts -->
    <script src="js/config-manager.js"></script>
    <script src="js/tts-google.js"></script>
    <script src="js/conversation-manager.js"></script>
    <script src="js/config-loader.js"></script>
    <script src="js/variables.js"></script>
    <script src="js/memory-system.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/classes.js"></script>
    <script src="js/system.js"></script>
    <script src="js/api.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/cognitive.js"></script>
    <script src="js/commands.js"></script>
    <script src="js/swarm.js"></script>
    <script src="js/proactive.js"></script>
    <script src="js/authority.js"></script>
    <script src="js/iot-manager.js"></script>
    <script src="js/plan-manager.js"></script>
    <script src="js/app.js"></script>
    <script>
        function openSettings() {
            document.getElementById("settings-modal").classList.remove("hidden");
            document.getElementById("cfg-gemini-key").value = ConfigManager.getGeminiKey();
            document.getElementById("cfg-google-key").value = ConfigManager.getGoogleCloudKey();
            document.getElementById("cfg-tts-provider").value = ConfigManager.getTTSProvider();
            document.getElementById("cfg-voice-id").value = ConfigManager.getVoiceId();
        }

        function closeSettings() {
            document.getElementById("settings-modal").classList.add("hidden");
        }

        function saveConfig() {
            ConfigManager.set("gemini_key", document.getElementById("cfg-gemini-key").value);
            ConfigManager.set("google_cloud_key", document.getElementById("cfg-google-key").value);
            ConfigManager.set("tts_provider", document.getElementById("cfg-tts-provider").value);
            ConfigManager.set("google_voice_id", document.getElementById("cfg-voice-id").value);
            if (typeof speak === "function") speak("Configurações salvas.");
            closeSettings();
        }
    </script>
</body>

</html>
